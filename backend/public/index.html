<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillQuiz - Portal Administrativo & Gestión Docente</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-center p-4 antialiased text-slate-800 selection:bg-blue-100 selection:text-blue-900">

  <!-- Tarjeta de Login Institucional -->
  <div class="w-full max-w-md bg-white border border-slate-200/90 rounded-2xl shadow-[0_10px_30px_-5px_rgba(15,23,42,0.08)] overflow-hidden">
    
    <!-- Encabezado de la Tarjeta -->
    <div class="bg-[#0F4C81] p-7 text-white text-center relative overflow-hidden">
      <!-- Acento de fondo sutil -->
      <div class="absolute inset-0 bg-gradient-to-b from-white/10 to-transparent pointer-events-none"></div>

      <div class="inline-flex w-12 h-12 rounded-xl bg-white/15 backdrop-blur-sm items-center justify-center mb-3 shadow-inner">
        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
        </svg>
      </div>
      <h1 class="text-2xl font-bold tracking-tight text-white">SkillQuiz</h1>
      <p class="text-xs text-blue-100 mt-1 font-medium">Portal Administrativo & Gestión Docente</p>
      <p class="text-[11px] text-blue-200/75 mt-0.5">Plataforma de Evaluación Interactiva</p>
    </div>

    <!-- Formulario de Acceso -->
    <div class="p-8">
      <div class="mb-5">
        <h2 class="text-base font-semibold text-slate-900">Acceso institucional</h2>
        <p class="text-xs text-slate-500 mt-0.5">Ingrese sus credenciales docentes para administrar el contenido.</p>
      </div>

      <form id="formLogin" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1.5" for="correo">
            Correo Institucional
          </label>
          <div class="relative">
            <input 
              type="email" 
              id="correo" 
              required
              value="admin@skillquiz.edu.pe"
              placeholder="admin@skillquiz.edu.pe" 
              class="w-full pl-9 pr-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-900 focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#0F4C81]/20 focus:border-[#0F4C81] transition"
            >
            <svg class="w-4 h-4 text-slate-400 absolute left-3 top-3 pointer-events-none" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207" />
            </svg>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1.5" for="password">
            Contraseña
          </label>
          <div class="relative">
            <input 
              type="password" 
              id="password" 
              required
              value="admin123"
              placeholder="••••••••" 
              class="w-full pl-9 pr-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-900 focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#0F4C81]/20 focus:border-[#0F4C81] transition"
            >
            <svg class="w-4 h-4 text-slate-400 absolute left-3 top-3 pointer-events-none" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
          </div>
        </div>

        <div id="loginFeedback" class="hidden p-3 rounded-xl text-xs font-medium border"></div>

        <button 
          type="submit" 
          id="btnSubmit"
          class="w-full py-2.5 px-4 bg-[#0F4C81] hover:bg-[#0C3D68] text-white font-semibold rounded-xl text-sm shadow-sm transition active:scale-[0.99] flex items-center justify-center gap-2"
        >
          <span>Iniciar sesión docente</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" />
          </svg>
        </button>
      </form>

      <div class="mt-6 pt-5 border-t border-slate-100 text-center">
        <p class="text-[11px] text-slate-500">
          Credenciales de acceso docente registradas en SQLite Cloud
        </p>
      </div>
    </div>
  </div>

  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const correo = document.getElementById('correo').value.trim();
      const password = document.getElementById('password').value;
      const feedback = document.getElementById('loginFeedback');
      const btn = document.getElementById('btnSubmit');

      feedback.className = 'hidden';
      btn.disabled = true;
      btn.innerHTML = '<span>Verificando credenciales...</span>';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ correo, password })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Credenciales no válidas');

        feedback.className = 'block p-3 rounded-xl text-xs font-medium bg-emerald-50 text-emerald-800 border-emerald-200';
        feedback.textContent = 'Acceso concedido. Redirigiendo al panel...';

        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 400);

      } catch (err) {
        feedback.className = 'block p-3 rounded-xl text-xs font-medium bg-rose-50 text-rose-800 border-rose-200';
        feedback.textContent = err.message;
        btn.disabled = false;
        btn.innerHTML = '<span>Iniciar sesión docente</span><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" /></svg>';
      }
    }
  </script>
</body>
</html>
